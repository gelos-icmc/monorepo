<table>
  <thead>
    <tr>
      <th><strong>ISO</strong></th>
      <th><strong>Tamanho</strong></th>
      <th><strong>Checksum (SHA256)</strong></th>
    </tr>
  </thead>
  <tbody>
    {% assign total_size = 0 %}
    {% for iso in include.data %}
    {% assign size = iso.size | remove: 'GB' | plus: 0 %}
    {% assign total_size = total_size | plus: size %}
    <tr>
      <td><a href="{{ iso.link }}">{{ iso.name }}</a></td>
      <td>{{ iso.size }}</td>
      <td><code>{{ iso.sha256 }}</code></td>
    </tr>
    {% endfor %}
  </tbody>
  <tfoot>
    <tr>
      <th scope="row">Total aproximado</th>
      <td>{{ total_size | round: 2 }} GB</td>
      <td></td>
    </tr>
  </tfoot>
</table>
